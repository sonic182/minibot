<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}minibot{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <script defer src="/static/vendor/lucide-1.46.0.min.js"></script>
  <script defer src="/static/nav.js"></script>
  <script type="module" src="/static/pager.js"></script>
  <script defer src="/static/confirm.js"></script>
</head>
<body>
  <nav class="navbar">
    <button type="button" class="burger" data-nav-toggle aria-label="Toggle menu" aria-expanded="false">
      <i data-lucide="menu" aria-hidden="true"></i>
    </button>
    <span class="brand">minibot</span>
  </nav>
  <div class="shell">
    <aside class="sidebar" data-nav-panel>
      <ul>
        {% for path, label in nav_entries %}
        <li><a href="{{ path }}"{% if path == request.url.path %} class="current"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
