[runtime]
log_level = "DEBUG"
environment = "development"
agent_timeout_seconds = 420
# The single person this MiniBot assists; owns memory, graph, schedules and RAG everywhere.
owner_id = "primary"

[channels.telegram]
enabled = true
bot_token = ""
allowed_chat_ids = []
allowed_user_ids = []
require_authorized = true
mode = "long_polling"
webhook_url = ""
media_enabled = true
max_photo_bytes = "5MB"
max_document_bytes = "10MB"
max_total_media_bytes = "12MB"
max_attachments_per_message = 3
allowed_document_mime_types = []

[llm]
provider = "openai_responses"
model = "gpt-5.6-luna"
reasoning_effort = "high"
http2 = true
max_tool_iterations = 60
max_new_tokens = 50000
request_timeout_seconds = 180
sock_connect_timeout_seconds = 10
sock_read_timeout_seconds = 180
retry_attempts = 3
retry_delay_seconds = 2.0
main_responses_state_mode = "full_messages"
agent_responses_state_mode = "previous_response_id"
prompt_cache_enabled = true
reasoning_summary = "detailed"
system_prompt = "You are Minibot, a helpful assistant."
system_prompt_file = "./prompts/main_agent_system.md"
prompts_dir = "./prompts"

[llm.openrouter]
# reasoning_enabled = true

[llm.openrouter.provider]
# only = ["deepinfra", "novita"]

[providers.openai]
api_key = ""
base_url = ""
# OpenCode Zen/Go setup: see config.example.toml [providers.openai] / [providers.openai_responses]

# OpenCode Go returns HTTP 400 MissingSessionID without this header; other endpoints ignore it.
[providers.openai.headers]
x-opencode-session = "minibot"

[providers.openai_responses]
api_key = ""
base_url = ""

[providers.openai_responses.headers]
x-opencode-session = "minibot"

# Named providers: `api_format` says which API the endpoint speaks, so the section name is free and
# several endpoints of the same format coexist. Agents point at the section name with
# `model_provider`, and the main agent can retarget a single spawn_task call at it
# ("run that on deepseek via opencode_go, high effort"). `models` is the advisory list it is offered
# to choose from.
# [providers.opencode_go]
# api_format = "openai_responses"
# api_key = "${OPENCODE_API_KEY}"
# base_url = "https://opencode.ai/zen/go/v1"
# models = ["deepseek-v3.6", "mimo-v2.5", "gpt-5.6-luna"]
# [providers.opencode_go.headers]
# x-opencode-session = "minibot"

# [providers.zai]
# api_format = "openai"
# api_key = "${ZAI_API_KEY}"
# base_url = "https://api.z.ai/api/coding/paas/v4"
# models = ["glm-5.3", "glm-5.3-flash"]

# Orchestrator on a ChatGPT Codex subscription (OAuth, no api_key) delegating to the aliases above:
# set [llm] provider = "chatgpt_codex" and model to one the login flow returns.
# [providers.chatgpt_codex]
# auth_path = "~/.minibot/auth_codex.json"

[providers.openrouter]
api_key = ""
base_url = ""

[providers.claude]
api_key = ""
base_url = ""

[providers.google]
api_key = ""
base_url = ""

[orchestration]
directory = "./agents"
tool_ownership_mode = "exclusive_mcp"
main_tool_use_guardrail = "disabled"

[orchestration.main_agent]
name = "minibot"
tools_deny = ["mcp*"]


[memory]
backend = "sqlite"
sqlite_url = "sqlite+aiosqlite:///./data/minibot.db"
max_history_messages = 200
max_history_tokens = 140000
notify_compaction_updates = false

[scheduler.prompts]
enabled = true
sqlite_url = "sqlite+aiosqlite:///./data/scheduled_prompts.db"
poll_interval_seconds = 60
lease_timeout_seconds = 120
batch_size = 10
max_attempts = 3
min_recurrence_interval_seconds = 60
pool_size = 5
echo = false

[tools.kv_memory]
enabled = true
sqlite_url = "sqlite+aiosqlite:///./data/kv_memory.db"
pool_size = 5
echo = false
default_limit = 20
max_limit = 100


[tools.http_client]
enabled = true
timeout_seconds = 30
max_bytes = "16KB"
# HTML-only parse budget: how much markup is decoded before it is compacted.
max_parse_bytes = "2MB"
# "auto" renders HTML as compact semantic text (links, forms, inputs, tables kept;
# classes/styles/scripts dropped), "text" is the older plain-text extraction,
# "compact" forces it, "none" returns the body untouched.
response_processing_mode = "auto"
# Inline body cap; falls back to max_bytes when unset.
max_chars = 6000
# Applies to plain text and "text" mode; compact output uses indentation as structure.
normalize_whitespace = true
spill_to_managed_file = true
spill_after_chars = 16000
spill_preview_chars = 2000
max_spill_bytes = "5MB"
spill_subdir = "http_responses/tmp"

[tools.file_storage]
enabled = true
root_dir = "./data/files"
max_write_bytes = "64KB"
allow_outside_root = true
save_incoming_uploads = true
uploads_subdir = "uploads"
incoming_temp_subdir = "uploads/temp"

[tools.grep]
enabled = true
max_matches = 200
max_file_size_bytes = "1MB"

[tools.audio_transcription]
enabled = true
model = "small"
device = "cpu"
compute_type = "int8"
beam_size = 5
vad_filter = true
auto_transcribe_short_incoming = true
auto_transcribe_max_duration_seconds = 45

[tools.browser]
output_dir = "./data/files/browser"

[tools.wait]
enabled = true
max_milliseconds = 30000

[tools.calculator]
enabled = true
default_scale = 28
max_expression_length = 200
max_exponent_abs = 1000

[tools.python_exec]
enabled = true
backend = "host"
python_path = ""
venv_path = ""
sandbox_mode = "none"
default_timeout_seconds = 8
max_timeout_seconds = 20
max_output_bytes = "64KB"
max_code_bytes = "32KB"
artifacts_enabled = true
artifacts_default_subdir = "generated"
artifacts_allowed_extensions = [".png", ".jpg", ".jpeg", ".pdf", ".csv", ".txt", ".json", ".svg"]
artifacts_max_files = 5
artifacts_max_file_bytes = "5MB"
artifacts_max_total_bytes = "20MB"
artifacts_allow_in_jail = false
artifacts_jail_shared_dir = ""
pass_parent_env = false
env_allowlist = ["PATH", "LANG", "LC_ALL", "PYTHONUTF8"]

# Deliberate opt-out: the default is `pass_parent_env = false`. This profile keeps the full parent
# environment — including any ${ENV_VAR} secret — reachable from `bash`. That is the yolo bargain.
[tools.bash]
enabled = true
default_timeout_seconds = 15
max_timeout_seconds = 120
max_output_bytes = "128KB"
pass_parent_env = true
env_allowlist = ["PATH", "HOME", "USER", "LANG", "LC_ALL", "SHELL"]

# Generic offload of oversized tool results to a managed temp file, so the agent can grep or read
# them back instead of carrying them in context. `bash` is deliberately NOT excluded: it has no
# spill of its own, only an inline truncation, so an oversized result (a browser snapshot, say)
# would ride along in every later step of a tool loop.
[tools.tool_output_spill]
enabled = true
spill_after_chars = 8000
preview_chars = 800
subdir = "tool_output/tmp"
exclude_tools = ["http_request", "pre_response"]

[tools.apply_patch]
enabled = true
restrict_to_workspace = true
workspace_root = "."
allow_outside_workspace = false
preserve_trailing_newline = true
max_patch_bytes = "256KB"

[logging]
structured = true
logfmt_enabled = true
log_level = "DEBUG"
kv_separator = "="
record_separator = " "

[tools.mcp]
enabled = true
name_prefix = "mcp"
timeout_seconds = 30

# Browser automation now goes through the `playwright-cli` agent skill (bash-driven
# `playwright-cli <verb>` commands) instead of the @playwright/mcp server.
# [[tools.mcp.servers]]
# name = "playwright-cli"
# transport = "stdio"
# command = "npx"
# args = [
#   "@playwright/mcp@latest",
#   "--headless",
#   "--browser=chromium",
#   "--caps=vision,pdf,network",
#   "--block-service-workers",
#   "--image-responses=omit",
#   "--snapshot-mode=incremental",
#   "--timeout-action=2000",
# ]
# env = {}
# cwd = "."
# enabled_tools = []
# disabled_tools = []

# Agent Skills (agentskills.io spec). `paths` REPLACES the project and user defaults;
# `native` and `write_path` are independent of it. See config.example.toml for the full contract.
[tools.skills]
enabled = true
preload_catalog = true
native = true
write_path = "./data/files/skills"
install = true
# paths = ["./skills"]
# native_disabled = []

[tools.rag]
enabled = true
backend = "sqlite"
sqlite_url = "sqlite+aiosqlite:///./data/rag.db"
# Switch to backend = "qdrant" with qdrant_url = "http://minibot-qdrant:6333" after uncommenting
# the minibot-qdrant service in docker-compose.yml.
collection_name = "minibot_chunks"
chunk_size_tokens = 96
chunk_overlap_tokens = 20
search_limit = 5
truncate_result_tokens = true
max_result_tokens = 1500

[tools.rag.embedding]
model = "sentence-transformers/all-MiniLM-L12-v2"
dim = 384
max_sequence_tokens = 128

[tools.rag.rerank]
enabled = true
model = "cross-encoder/ms-marco-MiniLM-L2-v2"
candidate_limit = 50
max_results = 7

[tasks]
enabled = true
backend = "sqlite"
worker_timeout_seconds = 1800
worker_max_steps = "unlimited"
worker_max_tool_calls = "unlimited"
max_concurrent_workers = 4

[tasks.sqlite]
sqlite_url = "sqlite+aiosqlite:///./data/tasks.db"
poll_interval_seconds = 5
# Must exceed tasks.worker_timeout_seconds or a running task can be leased twice.
lease_timeout_seconds = 2100
batch_size = 4
max_attempts = 3
done_retention_seconds = 2592000

[rabbitmq]
broker_url = "amqp://guest:guest@minibot-rabbitmq:5672/"
queue_name = "minibot.tasks.worker"
exchange_name = "minibot.tasks"
prefetch_count = 1

# Relation-graph tool. Listed here rather than bundled so it also loads inside task workers.
# Needs its extra installed: poetry install --extras graph
[extensions]
modules = ["minibot.extensions.tools.graph"]
