services:
  # Only needed with [tasks].backend = "rabbitmq" in config.toml; sqlite is the default and needs no broker.
  # minibot-rabbitmq:
  #   image: rabbitmq:4.2-management
  #   container_name: minibot-rabbit
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  # Only needed with [tools.rag].backend = "qdrant" in config.toml; sqlite is the default and needs no service.
  # minibot-qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: minibot-qdrant
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/qdrant:/qdrant/storage

  minibot:
    build: .
    container_name: minibot
    restart: unless-stopped
    # Uncomment alongside the service it names.
    # depends_on:
    #   minibot-rabbitmq:
    #     condition: service_healthy
    #   minibot-qdrant:
    #     condition: service_started
    init: true
    volumes:
      - ./docker-requirements.txt:/app/docker-requirements.txt:ro
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./minibot:/app/minibot
      - ./prompts:/app/prompts:ro
      - ./agents:/app/agents
      - ./skills:/app/skills
      # Codex OAuth credentials for [llm] provider = "chatgpt_codex". Log in on the host first:
      # poetry run minibot codex login --device-code
      # (the container's uid 1000 must be able to write this dir, since the provider rewrites
      # auth_codex.json on token refresh).
      - ${HOME}/.minibot:/home/minibot/.minibot
    command: ["minibot"]
